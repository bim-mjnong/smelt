<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 120" width="380" height="120" role="img" aria-label="smelt">
  <title>smelt</title>
  <!--
    Wordmark: the pour plus hand-cut stencil letterforms. The letters are polygons, not
    text, so this file renders identically everywhere and needs no font installed or
    embedded. Cap height 100, stroke weight 22, every vertex on a whole-unit grid —
    chiselled rather than drawn.

    The letters are painted in iron (#6E7783), which is deliberately mid-tone so the
    same file reads on a white README and a charcoal one. Embedding it in a page you
    control? Swap the group's `fill` for `currentColor`.
  -->
  <defs>
    <linearGradient id="wm-iron" x1="20" y1="14" x2="20" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A505A" />
      <stop offset="1" stop-color="#2A2E34" />
    </linearGradient>
    <linearGradient id="wm-melt" x1="20" y1="17" x2="20" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5893A" />
      <stop offset="1" stop-color="#E4602F" />
    </linearGradient>
    <linearGradient id="wm-stream" x1="32.5" y1="26" x2="32.5" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5893A" />
      <stop offset="1" stop-color="#E4602F" />
    </linearGradient>
    <linearGradient id="wm-ingot" x1="32" y1="47" x2="32" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A505A" />
      <stop offset="1" stop-color="#2A2E34" />
    </linearGradient>
  </defs>

  <g transform="translate(4 8) scale(1.5)">
    <polygon points="12,52 32,62 52,52 32,42" fill="#0E0F12" opacity="0.45" />
    <polygon points="8,18 32,30 32,56 8,44" fill="#1B1D22" />
    <polygon points="32,30 56,18 56,44 32,56" fill="#131417" />
    <g fill="#2A2E34">
      <polygon points="12,24 18,27 18,33 12,30" />
      <polygon points="22,33 28,36 28,42 22,39" />
      <polygon points="10,36 14,38 14,44 10,42" />
      <polygon points="36,34 42,31 42,37 36,40" />
      <polygon points="46,27 52,24 52,30 46,33" />
      <polygon points="38,44 44,41 44,47 38,50" />
    </g>
    <g fill="#E4602F">
      <polygon points="14,21 18,23 18,29 14,27" />
      <polygon points="18,29 21,30.5 21,36.5 18,35" />
      <polygon points="26,27 29,28.5 29,38.5 26,37" />
      <polygon points="29,38.5 31,39.5 31,45.5 29,44.5" />
      <polygon points="50,21 46,23 46,29 50,27" />
      <polygon points="46,29 43,30.5 43,38.5 46,37" />
      <polygon points="37,32.5 39,31.5 39,41.5 37,42.5" />
    </g>
    <g fill="#F5893A">
      <polygon points="18,25 21,26.5 21,30.5 18,29" />
      <polygon points="46,25 43,26.5 43,30.5 46,29" />
    </g>
    <polygon points="32,6 56,18 32,30 8,18" fill="#E4602F" />
    <g fill="#F5893A">
      <polygon points="32,6 40,10 32,14 24,10" />
      <polygon points="44,12 50,15 44,18 38,15" />
      <polygon points="20,14 26,17 20,20 14,17" />
      <polygon points="32,18 38,21 32,24 26,21" />
      <polygon points="42,20 46,22 42,24 38,22" />
      <polygon points="22,22 26,24 22,26 18,24" />
    </g>
    <g fill="#FFF1D9">
      <polygon points="32,10 36,12 32,14 28,12" />
      <polygon points="26,17 30,19 26,21 22,19" />
      <polygon points="40,16 43,17.5 40,19 37,17.5" />
    </g>
    <polygon points="32,6 56,18 32,30 8,18" fill="none" stroke="#2A2E34" stroke-width="1.5" stroke-linejoin="miter" />
    <polyline points="8,18 8,44 32,56 56,44 56,18" fill="none" stroke="#2A2E34" stroke-width="1.5" stroke-linejoin="miter" />
    <polyline points="32,30 32,56" fill="none" stroke="#2A2E34" stroke-width="1.5" />
  </g>

  <!-- s m e l t — five stencil polygons -->
  <g fill="#6E7783" transform="translate(108 30) scale(0.6)">
    <path d="M10,0 H72 V22 H22 V39 H72 V90 L62,100 H0 V78 H50 V61 H0 V10 Z" />
    <path d="M90,100 V0 H110 L134,52 L158,0 H178 V100 H156 V46 L134,86 L112,46 V100 Z" />
    <path d="M196,0 H268 V22 H218 V39 H260 V61 H218 V78 H268 V100 H196 Z" />
    <path d="M286,0 H308 V78 H346 V100 H286 Z" />
    <path d="M362,0 H430 V22 H407 V100 H385 V22 H362 Z" />
  </g>
</svg>
