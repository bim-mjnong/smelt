<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="smelt — structure-aware, reversible context optimization for coding agents">
  <title>smelt</title>
  <!--
    GitHub social preview (1280×640). The mark and letterforms are geometry, so they
    render identically anywhere; the two prose lines are `<text>` with a system stack,
    which is why the committed PNG next to this file is the canonical version to upload.
  -->
  <defs>
    <linearGradient id="sp-ground" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B1D22" />
      <stop offset="1" stop-color="#0D0E11" />
    </linearGradient>
    <radialGradient id="sp-glow" cx="640" cy="300" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4602F" stop-opacity="0.22" />
      <stop offset="1" stop-color="#E4602F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sp-iron" x1="32" y1="8" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F5661" />
      <stop offset="1" stop-color="#2A2E34" />
    </linearGradient>
    <linearGradient id="sp-mouth" x1="32" y1="31" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5893A" />
      <stop offset="1" stop-color="#E4602F" />
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#sp-ground)" />
  <rect width="1280" height="640" fill="url(#sp-glow)" />

  <!-- hairline hearth rule, the full width of the plate -->
  <rect x="0" y="556" width="1280" height="1.5" fill="#2A2E34" />
  <rect x="0" y="556" width="392" height="1.5" fill="#E4602F" opacity="0.7" />

  <g transform="translate(300 163) scale(2.6)">
    <polygon points="25.5,7.5 38.5,7.5 37,3.5 27,3.5" fill="#E4602F" />
    <polygon points="28.5,7.5 35.5,7.5 34.5,5 29.5,5" fill="#FFF1D9" opacity="0.85" />
    <polygon
      points="26,7 38,7 43,17 51.5,29 53,52 11,52 13,29 21,17"
      fill="url(#sp-iron)"
      stroke="#6E7783"
      stroke-width="1.25"
      stroke-linejoin="miter"
    />
    <g fill="none" stroke="#8B94A1" stroke-width="1" opacity="0.5">
      <polyline points="21.5,18 24.5,29.5" />
      <polyline points="42.5,18 39.5,29.5" />
    </g>
    <polygon points="32,31 38.5,41 38.5,52 25.5,52 25.5,41" fill="url(#sp-mouth)" />
    <polygon points="32,36 34.75,42.5 34.75,52 29.25,52 29.25,42.5" fill="#FFF1D9" />
    <polygon
      points="4,52 60,52 58,60 6,60"
      fill="#343941"
      stroke="#6E7783"
      stroke-width="1.25"
      stroke-linejoin="miter"
    />
    <polygon points="27.5,60 36.5,60 34.5,63.5 29.5,63.5" fill="#E4602F" />
  </g>

  <g fill="#EFEBE5" transform="translate(496 195) scale(1.1)">
    <path d="M10,0 H72 V22 H22 V39 H72 V90 L62,100 H0 V78 H50 V61 H0 V10 Z" />
    <path d="M90,100 V0 H110 L134,52 L158,0 H178 V100 H156 V46 L134,86 L112,46 V100 Z" />
    <path d="M196,0 H268 V22 H218 V39 H260 V61 H218 V78 H268 V100 H196 Z" />
    <path d="M286,0 H308 V78 H346 V100 H286 Z" />
    <path d="M362,0 H430 V22 H407 V100 H385 V22 H362 Z" />
  </g>

  <text
    x="640"
    y="410"
    text-anchor="middle"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="38"
    fill="#B4BAC4"
  >Structure-aware, reversible context optimization for coding agents.</text>

  <text
    x="640"
    y="475"
    text-anchor="middle"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="24"
    letter-spacing="3.5"
    fill="#E4602F"
  >ZERO NETWORK · EVERY ELISION EXPLAINABLE · EVERY ELISION REVERSIBLE</text>

  <text
    x="640"
    y="602"
    text-anchor="middle"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="21"
    letter-spacing="1.5"
    fill="#6E7783"
  >@smeltjs/core — Apache-2.0 — a library, not a proxy</text>
</svg>
