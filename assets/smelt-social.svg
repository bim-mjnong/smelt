<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="smelt — structure-aware, reversible context optimization for coding agents">
  <title>smelt</title>
  <!--
    GitHub social preview (1280×640). The mark and letterforms are geometry, so they
    render identically anywhere; the two prose lines are `<text>` with a system stack,
    which is why the committed PNG next to this file is the canonical version to upload.
  -->
  <defs>
    <linearGradient id="sp-ground" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B1D22" />
      <stop offset="1" stop-color="#0D0E11" />
    </linearGradient>
    <radialGradient id="sp-glow" cx="640" cy="300" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4602F" stop-opacity="0.22" />
      <stop offset="1" stop-color="#E4602F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sp-iron" x1="20" y1="14" x2="20" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F5661" />
      <stop offset="1" stop-color="#2A2E34" />
    </linearGradient>
    <linearGradient id="sp-melt" x1="20" y1="17" x2="20" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5893A" />
      <stop offset="1" stop-color="#E4602F" />
    </linearGradient>
    <linearGradient id="sp-stream" x1="32.5" y1="26" x2="32.5" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5893A" />
      <stop offset="1" stop-color="#E4602F" />
    </linearGradient>
    <linearGradient id="sp-ingot" x1="32" y1="47" x2="32" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F5661" />
      <stop offset="1" stop-color="#2A2E34" />
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#sp-ground)" />
  <rect width="1280" height="640" fill="url(#sp-glow)" />

  <!-- hairline hearth rule, the full width of the plate -->
  <rect x="0" y="556" width="1280" height="1.5" fill="#2A2E34" />
  <rect x="0" y="556" width="392" height="1.5" fill="#E4602F" opacity="0.7" />

  <g transform="translate(316 163) scale(2.8)">
    <g fill="#6E7783">
      <polygon points="10,4 15,5.5 12.5,9.5" />
      <polygon points="19,2 23.5,3.5 21,7.5" />
      <polygon points="4.5,9 8.5,8 7.5,12.5" />
    </g>
    <polygon
      points="6,16 32,23 34,26 26,34 12,31 4,20"
      fill="url(#sp-iron)"
      stroke="#6E7783"
      stroke-width="1.25"
      stroke-linejoin="miter"
    />
    <polygon points="8,17.5 31.5,23.75 29.5,26 9.5,20.5" fill="url(#sp-melt)" />
    <polygon points="27,22.5 31.5,23.75 30,25.25 26,24" fill="#FFF1D9" opacity="0.85" />
    <polyline points="10,24 20,28.5" fill="none" stroke="#8B94A1" stroke-width="1" opacity="0.5" />
    <polygon points="30.5,25 34.5,26 33.5,47 31,47" fill="url(#sp-stream)" />
    <polygon points="31.75,25.5 33.25,25.9 32.75,47 31.75,47" fill="#FFF1D9" opacity="0.9" />
    <polygon
      points="21,47 43,47 46.5,57 17.5,57"
      fill="url(#sp-ingot)"
      stroke="#6E7783"
      stroke-width="1.25"
      stroke-linejoin="miter"
    />
    <polygon points="27,47 38,47 37,49 28,49" fill="#E4602F" />
    <g fill="none" stroke="#FFF1D9" stroke-width="1.5" stroke-linecap="square" opacity="0.95">
      <polyline points="26.5,50.5 24,52.5 26.5,54.5" />
      <polyline points="30.5,50.5 28,52.5 30.5,54.5" />
      <polyline points="37.5,50.5 40,52.5 37.5,54.5" />
      <polyline points="33.5,50.5 36,52.5 33.5,54.5" />
    </g>
    <polygon points="14,57 50,57 48.5,60.5 15.5,60.5" fill="#2A2E34" />
  </g>

  <g fill="#EFEBE5" transform="translate(496 195) scale(1.1)">
    <path d="M10,0 H72 V22 H22 V39 H72 V90 L62,100 H0 V78 H50 V61 H0 V10 Z" />
    <path d="M90,100 V0 H110 L134,52 L158,0 H178 V100 H156 V46 L134,86 L112,46 V100 Z" />
    <path d="M196,0 H268 V22 H218 V39 H260 V61 H218 V78 H268 V100 H196 Z" />
    <path d="M286,0 H308 V78 H346 V100 H286 Z" />
    <path d="M362,0 H430 V22 H407 V100 H385 V22 H362 Z" />
  </g>

  <text
    x="640"
    y="410"
    text-anchor="middle"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="38"
    fill="#B4BAC4"
  >Structure-aware, reversible context optimization for coding agents.</text>

  <text
    x="640"
    y="475"
    text-anchor="middle"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="24"
    letter-spacing="3.5"
    fill="#E4602F"
  >ZERO NETWORK · EVERY ELISION EXPLAINABLE · EVERY ELISION REVERSIBLE</text>

  <text
    x="640"
    y="602"
    text-anchor="middle"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="21"
    letter-spacing="1.5"
    fill="#6E7783"
  >@smeltjs/core — Apache-2.0 — a library, not a proxy</text>
</svg>
