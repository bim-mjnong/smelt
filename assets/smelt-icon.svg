<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="smelt">
  <title>smelt</title>
  <!--
    Square icon: the GitHub org/repo avatar. Same pour as assets/smelt-mark.svg, on a
    charcoal ground, with the geometry inlined rather than referenced — an avatar has to
    be one self-contained file.

    If the mark changes, both files change. That duplication is deliberate and small;
    assets/PALETTE.md records which files carry the geometry.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B1D22" />
      <stop offset="1" stop-color="#0E0F12" />
    </linearGradient>
    <radialGradient id="glow" cx="288" cy="380" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4602F" stop-opacity="0.30" />
      <stop offset="1" stop-color="#E4602F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="icon-iron" x1="20" y1="14" x2="20" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F5661" />
      <stop offset="1" stop-color="#2A2E34" />
    </linearGradient>
    <linearGradient id="icon-melt" x1="20" y1="17" x2="20" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5893A" />
      <stop offset="1" stop-color="#E4602F" />
    </linearGradient>
    <linearGradient id="icon-stream" x1="32.5" y1="26" x2="32.5" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5893A" />
      <stop offset="1" stop-color="#E4602F" />
    </linearGradient>
    <linearGradient id="icon-ingot" x1="32" y1="47" x2="32" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F5661" />
      <stop offset="1" stop-color="#2A2E34" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#ground)" />
  <rect width="512" height="512" rx="104" fill="url(#glow)" />

  <g transform="translate(80 48) scale(6.5)">
    <g fill="#6E7783">
      <polygon points="10,4 15,5.5 12.5,9.5" />
      <polygon points="19,2 23.5,3.5 21,7.5" />
      <polygon points="4.5,9 8.5,8 7.5,12.5" />
    </g>
    <polygon
      points="6,16 32,23 34,26 26,34 12,31 4,20"
      fill="url(#icon-iron)"
      stroke="#6E7783"
      stroke-width="1.25"
      stroke-linejoin="miter"
    />
    <polygon points="8,17.5 31.5,23.75 29.5,26 9.5,20.5" fill="url(#icon-melt)" />
    <polygon points="27,22.5 31.5,23.75 30,25.25 26,24" fill="#FFF1D9" opacity="0.85" />
    <polyline points="10,24 20,28.5" fill="none" stroke="#8B94A1" stroke-width="1" opacity="0.5" />
    <polygon points="30.5,25 34.5,26 33.5,47 31,47" fill="url(#icon-stream)" />
    <polygon points="31.75,25.5 33.25,25.9 32.75,47 31.75,47" fill="#FFF1D9" opacity="0.9" />
    <polygon
      points="21,47 43,47 46.5,57 17.5,57"
      fill="url(#icon-ingot)"
      stroke="#6E7783"
      stroke-width="1.25"
      stroke-linejoin="miter"
    />
    <polygon points="27,47 38,47 37,49 28,49" fill="#E4602F" />
    <g fill="none" stroke="#FFF1D9" stroke-width="1.5" stroke-linecap="square" opacity="0.95">
      <polyline points="26.5,50.5 24,52.5 26.5,54.5" />
      <polyline points="30.5,50.5 28,52.5 30.5,54.5" />
      <polyline points="37.5,50.5 40,52.5 37.5,54.5" />
      <polyline points="33.5,50.5 36,52.5 33.5,54.5" />
    </g>
    <polygon points="14,57 50,57 48.5,60.5 15.5,60.5" fill="#2A2E34" />
  </g>
</svg>
