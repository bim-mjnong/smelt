<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="smelt">
  <title>smelt</title>
  <!--
    Square icon: the GitHub org/repo avatar. Same furnace as assets/smelt-mark.svg, on a
    charcoal ground, with the geometry inlined rather than referenced — an avatar has to
    be one self-contained file.

    If the mark changes, both files change. That duplication is deliberate and small;
    assets/PALETTE.md records which files carry the geometry.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B1D22" />
      <stop offset="1" stop-color="#0E0F12" />
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="360" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4602F" stop-opacity="0.30" />
      <stop offset="1" stop-color="#E4602F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="icon-iron" x1="256" y1="60" x2="256" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F5661" />
      <stop offset="1" stop-color="#2A2E34" />
    </linearGradient>
    <linearGradient id="icon-mouth" x1="256" y1="212" x2="256" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5893A" />
      <stop offset="1" stop-color="#E4602F" />
    </linearGradient>
    <linearGradient id="icon-hearth" x1="60" y1="340" x2="452" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3F444C" />
      <stop offset="1" stop-color="#2A2E34" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#ground)" />
  <rect width="512" height="512" rx="104" fill="url(#glow)" />

  <g transform="translate(70 62) scale(5.8)">
    <polygon points="25.5,7.5 38.5,7.5 37,3.5 27,3.5" fill="#E4602F" />
    <polygon points="28.5,7.5 35.5,7.5 34.5,5 29.5,5" fill="#FFF1D9" opacity="0.85" />

    <polygon
      points="26,7 38,7 43,17 51.5,29 53,52 11,52 13,29 21,17"
      fill="url(#icon-iron)"
      stroke="#6E7783"
      stroke-width="1.25"
      stroke-linejoin="miter"
    />

    <g fill="none" stroke="#8B94A1" stroke-width="1" opacity="0.5">
      <polyline points="21.5,18 24.5,29.5" />
      <polyline points="42.5,18 39.5,29.5" />
    </g>

    <polygon points="32,31 38.5,41 38.5,52 25.5,52 25.5,41" fill="url(#icon-mouth)" />
    <polygon points="32,36 34.75,42.5 34.75,52 29.25,52 29.25,42.5" fill="#FFF1D9" />

    <polygon
      points="4,52 60,52 58,60 6,60"
      fill="url(#icon-hearth)"
      stroke="#6E7783"
      stroke-width="1.25"
      stroke-linejoin="miter"
    />

    <polygon points="27.5,60 36.5,60 34.5,63.5 29.5,63.5" fill="#E4602F" />
  </g>
</svg>
