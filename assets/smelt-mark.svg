<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="smelt">
  <title>smelt</title>
  <!--
    The smelt mark, v2: the pour.

    A tilted crucible, a molten stream, and a small dense ingot stamped with the
    library's own marker chevrons — big in, small out, nothing lost. The story the
    library tells (elide, keep the essence, retrievable by hash) drawn as metallurgy.

    Norse materially rather than typographically — crucible, iron, charcoal, ember.
    No runes, still: sowilo is doubled in the SS insignia and the valknut has been
    taken over by white-supremacist groups. The stamp on the ingot is not a rune; it
    is smelt's own wire marker, <<…>>, the glyph the model actually sees.

    Coordinates sit on a whole- or half-unit grid where the geometry allows; the
    crucible is deliberately asymmetric — chisel work, not a CAD extrusion.

    Palette and usage rules: assets/PALETTE.md
  -->
  <defs>
    <linearGradient id="smelt-iron" x1="20" y1="14" x2="20" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A505A" />
      <stop offset="1" stop-color="#2A2E34" />
    </linearGradient>
    <linearGradient id="smelt-melt" x1="20" y1="17" x2="20" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5893A" />
      <stop offset="1" stop-color="#E4602F" />
    </linearGradient>
    <linearGradient id="smelt-stream" x1="32.5" y1="26" x2="32.5" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5893A" />
      <stop offset="1" stop-color="#E4602F" />
    </linearGradient>
    <linearGradient id="smelt-ingot" x1="32" y1="47" x2="32" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A505A" />
      <stop offset="1" stop-color="#2A2E34" />
    </linearGradient>
  </defs>

  <!-- the charge: three raw shards tipping in — the oversized input -->
  <g fill="#6E7783">
    <polygon points="10,4 15,5.5 12.5,9.5" />
    <polygon points="19,2 23.5,3.5 21,7.5" />
    <polygon points="4.5,9 8.5,8 7.5,12.5" />
  </g>

  <!-- the crucible: tilted, pouring right. Asymmetric on purpose. -->
  <polygon
    points="6,16 32,23 34,26 26,34 12,31 4,20"
    fill="url(#smelt-iron)"
    stroke="#666E7A"
    stroke-width="1.25"
    stroke-linejoin="miter"
  />
  <!-- the melt: a sliver of heat along the open mouth -->
  <polygon points="8,17.5 31.5,23.75 29.5,26 9.5,20.5" fill="url(#smelt-melt)" />
  <!-- white-hot line at the lip, where the pour begins -->
  <polygon points="27,22.5 31.5,23.75 30,25.25 26,24" fill="#FFF1D9" opacity="0.85" />
  <!-- chisel facet on the belly -->
  <polyline points="10,24 20,28.5" fill="none" stroke="#818A97" stroke-width="1" opacity="0.5" />

  <!-- the stream: tapering as it falls — the budget squeezing the blob -->
  <polygon points="30.5,25 34.5,26 33.5,47 31,47" fill="url(#smelt-stream)" />
  <polygon points="31.75,25.5 33.25,25.9 32.75,47 31.75,47" fill="#FFF1D9" opacity="0.9" />

  <!-- the ingot: small, dense, everything that mattered -->
  <polygon
    points="21,47 43,47 46.5,57 17.5,57"
    fill="url(#smelt-ingot)"
    stroke="#666E7A"
    stroke-width="1.25"
    stroke-linejoin="miter"
  />
  <!-- molten seam where the stream lands -->
  <polygon points="27,47 38,47 37,49 28,49" fill="#E4602F" />

  <!-- the stamp: smelt's own marker delimiters, << >>, struck into the face -->
  <g fill="none" stroke="#FFF1D9" stroke-width="1.5" stroke-linecap="square" opacity="0.95">
    <polyline points="26.5,50.5 24,52.5 26.5,54.5" />
    <polyline points="30.5,50.5 28,52.5 30.5,54.5" />
    <polyline points="37.5,50.5 40,52.5 37.5,54.5" />
    <polyline points="33.5,50.5 36,52.5 33.5,54.5" />
  </g>

  <!-- hearth shadow: the bar the ingot rests on -->
  <polygon points="14,57 50,57 48.5,60.5 15.5,60.5" fill="#2A2E34" />
</svg>
