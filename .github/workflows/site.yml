name: site

# Builds site/ and deploys it to GitHub Pages (https://smeltjs.github.io/smelt/).
#
# Deliberately keyless: the build needs ZERO React Bits registry access. The
# REACTBITS_LICENSE_KEY exists only on a developer machine, and only for INSTALLING
# new registry items into the source tree; building renders committed sources plus the
# facts the packages own, parsed at build time — Law 4 lives in site/scripts/. No
# secret is read anywhere in this workflow, and nothing it runs touches the network.
#
# The trigger paths are the site's real inputs, not just its directory. The site used
# to redeploy on `site/**` alone, so a release moved the version on npm and left the
# deployed page advertising the previous one, with nothing anywhere going red. Every
# source `site/scripts/facts-data.mjs` reads is listed here.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'packages/core/bench/RESULTS.md'
      - 'packages/*/package.json'
      - 'packages/core/src/harness/**'
      - 'packages/core/src/lang/**'
      - 'guards.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `...` selects the site *and its dependencies*, in topological order, so
      # @smeltjs/core is built before the site's generator imports its registries.
      - run: pnpm --filter "@smeltjs/site..." build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
